<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Llave — Alquilar sin meses adelantados">
  <defs>
    <linearGradient id="g-headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a1e13"/>
      <stop offset="55%" stop-color="#8a3722"/>
      <stop offset="100%" stop-color="#c4513a"/>
    </linearGradient>
    <radialGradient id="g-blob-tl" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#f7d9cb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#faf8f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-blob-br" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#fbeee5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#faf8f3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4a1e13" flood-opacity="0.15"/>
    </filter>
    <filter id="tiny-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4a1e13" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#faf8f3"/>
  <rect width="1280" height="640" fill="url(#g-blob-tl)"/>
  <rect width="1280" height="640" fill="url(#g-blob-br)"/>

  <!-- ============ LEFT COLUMN: brand + headline + chips ============ -->

  <!-- Logo badge -->
  <g transform="translate(80,80)" filter="url(#soft-shadow)">
    <rect width="120" height="120" rx="28" fill="#8a3722"/>
    <g transform="translate(30,24) scale(2.4)" stroke="#faf8f3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="12" cy="9" rx="5.2" ry="6" transform="rotate(-10 12 9)"/>
      <path d="M12 15 V31"/>
      <path d="M12 31 H31"/>
      <path d="M15.5 31 V26.2 L17.4 24 L19.3 26.2 V31" stroke-width="1.9"/>
      <path d="M21.4 31 V27.4 L22.9 25.6 L24.4 27.4 V31" stroke-width="1.9"/>
      <path d="M26.5 31 V28.3 L27.7 26.9 L28.9 28.3 V31" stroke-width="1.9"/>
    </g>
  </g>

  <!-- Wordmark + eyebrow -->
  <g transform="translate(220,100)" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif">
    <text x="0" y="42" font-size="44" font-weight="800" fill="#8a3722" letter-spacing="-1.5">Llave</text>
    <text x="0" y="78" font-size="16" font-weight="600" fill="#4a5b58" letter-spacing="2">ALQUILAR · VENEZUELA · IA</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80,260)" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif">
    <text x="0" y="0" font-size="76" font-weight="900" fill="#0b1f1c" letter-spacing="-2">Alquilá hoy.</text>
    <text x="0" y="78" font-size="76" font-weight="900" fill="#0b1f1c" letter-spacing="-2">Sin meses</text>
    <text x="0" y="156" font-size="76" font-weight="900" fill="url(#g-headline)" letter-spacing="-2">adelantados.</text>
  </g>

  <!-- Chips -->
  <g transform="translate(80,490)" font-family="'Plus Jakarta Sans', system-ui" font-weight="600" font-size="17">
    <!-- chip 1 — speed -->
    <g transform="translate(0,0)" filter="url(#tiny-shadow)">
      <rect width="138" height="46" rx="23" fill="#8a3722"/>
      <g transform="translate(16,15)">
        <path d="M8 0 L0 12 L7 12 L4 22 L13 9 L7 9 Z" fill="#f4d5c4"/>
      </g>
      <text x="42" y="30" fill="#faf8f3">Alquilá hoy</text>
    </g>
    <!-- chip 2 — 0 meses -->
    <g transform="translate(154,0)" filter="url(#tiny-shadow)">
      <rect width="200" height="46" rx="23" fill="#fbeee5" stroke="#f7d9cb" stroke-width="1"/>
      <text x="100" y="30" text-anchor="middle" fill="#8a3722">0 meses adelantados</text>
    </g>
    <!-- chip 3 — depósito -->
    <g transform="translate(370,0)" filter="url(#tiny-shadow)">
      <rect width="240" height="46" rx="23" fill="#fbeee5" stroke="#f7d9cb" stroke-width="1"/>
      <text x="120" y="30" text-anchor="middle" fill="#8a3722">1 mes depósito reembolsable</text>
    </g>
    <!-- chip 4 — AI -->
    <g transform="translate(626,0)" filter="url(#tiny-shadow)">
      <rect width="156" height="46" rx="23" fill="#fbeee5" stroke="#f7d9cb" stroke-width="1"/>
      <g transform="translate(16,12)">
        <path d="M11 0 L13 8 L21 10 L13 12 L11 20 L9 12 L1 10 L9 8 Z" fill="#c4513a"/>
      </g>
      <text x="78" y="30" text-anchor="middle" fill="#8a3722" dx="14">Llavero IA</text>
    </g>
  </g>

  <!-- ============ RIGHT COLUMN: property card stack + chat bubble ============ -->

  <!-- Bottom card (largest, behind) -->
  <g transform="translate(910,260) rotate(8)" filter="url(#soft-shadow)">
    <rect width="280" height="180" rx="20" fill="#ffffff" stroke="#e7e3d8"/>
    <rect x="20" y="20" width="240" height="100" rx="12" fill="#e0856e"/>
    <rect x="36" y="60" width="60" height="6" rx="3" fill="#fbeee5" opacity="0.7"/>
    <rect x="36" y="74" width="100" height="6" rx="3" fill="#fbeee5" opacity="0.4"/>
    <text x="20" y="146" font-family="'Plus Jakarta Sans', system-ui" font-size="14" font-weight="700" fill="#0b1f1c">$280/mes</text>
    <text x="20" y="166" font-family="'Inter', system-ui" font-size="12" fill="#4a5b58">Caracas · 2 hab</text>
  </g>

  <!-- Middle card -->
  <g transform="translate(870,180) rotate(-3)" filter="url(#soft-shadow)">
    <rect width="280" height="180" rx="20" fill="#ffffff" stroke="#e7e3d8"/>
    <rect x="20" y="20" width="240" height="100" rx="12" fill="#c4513a"/>
    <rect x="36" y="60" width="80" height="6" rx="3" fill="#fbeee5" opacity="0.7"/>
    <rect x="36" y="74" width="120" height="6" rx="3" fill="#fbeee5" opacity="0.4"/>
    <text x="20" y="146" font-family="'Plus Jakarta Sans', system-ui" font-size="14" font-weight="700" fill="#0b1f1c">$250/mes</text>
    <text x="20" y="166" font-family="'Inter', system-ui" font-size="12" fill="#4a5b58">Maracaibo · 2 hab</text>
  </g>

  <!-- Top card (foreground) -->
  <g transform="translate(900,100) rotate(2)" filter="url(#soft-shadow)">
    <rect width="280" height="180" rx="20" fill="#ffffff" stroke="#e7e3d8"/>
    <rect x="20" y="20" width="240" height="100" rx="12" fill="#8a3722"/>
    <text x="36" y="48" font-family="'Plus Jakarta Sans', system-ui" font-size="11" font-weight="700" fill="#fbeee5" opacity="0.9">SIN MESES ADELANTADOS</text>
    <rect x="36" y="62" width="100" height="8" rx="4" fill="#fbeee5" opacity="0.8"/>
    <rect x="36" y="78" width="140" height="8" rx="4" fill="#fbeee5" opacity="0.5"/>
    <text x="20" y="146" font-family="'Plus Jakarta Sans', system-ui" font-size="16" font-weight="700" fill="#0b1f1c">$280/mes</text>
    <text x="20" y="166" font-family="'Inter', system-ui" font-size="12" fill="#4a5b58">Las Mercedes · 2 hab · 85m²</text>
  </g>

  <!-- Chat bubble from Llavero -->
  <g transform="translate(820,440)" filter="url(#soft-shadow)">
    <rect width="320" height="84" rx="22" fill="#0b1f1c"/>
    <g transform="translate(18,18)">
      <circle cx="22" cy="22" r="22" fill="#8a3722"/>
      <g transform="translate(7,7) scale(0.93)" stroke="#faf8f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <ellipse cx="12" cy="9" rx="4.6" ry="5.4" transform="rotate(-10 12 9)"/>
        <path d="M12 14 V30"/>
        <path d="M12 30 H29"/>
        <path d="M15.5 30 V26 L17.3 24 L19 26 V30" stroke-width="1.6"/>
        <path d="M21 30 V27 L22.5 25.6 L24 27 V30" stroke-width="1.6"/>
        <path d="M26 30 V28.3 L27 27 L28 28.3 V30" stroke-width="1.6"/>
      </g>
    </g>
    <text x="76" y="34" font-family="'Plus Jakarta Sans', system-ui" font-size="13" font-weight="700" fill="#faf8f3" opacity="0.7">LLAVERO IA</text>
    <text x="76" y="58" font-family="'Inter', system-ui" font-size="14" fill="#faf8f3">Encontré 3 inmuebles que encajan</text>
    <text x="76" y="76" font-family="'Inter', system-ui" font-size="14" fill="#faf8f3" opacity="0.7">con tu presupuesto. ¿Agendamos visita?</text>
  </g>

  <!-- Footer line -->
  <text x="80" y="600" font-family="'Inter', system-ui" font-size="14" fill="#7c8a87" letter-spacing="0.5">
    Construido en Venezuela · Powered by Claude · llave-ruby.vercel.app
  </text>
</svg>
